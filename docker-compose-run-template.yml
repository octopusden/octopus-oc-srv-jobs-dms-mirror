version: "3.7"

services:
  dms_mirror:
    environment:
      - AMQP_URL=${AMQP_URL}
      - AMQP_USER=${AMQP_USER}
      - AMQP_PASSWORD=${AMQP_PASSWORD}
      - MVN_URL=${MVN_URL}
      - MVN_USER=${MVN_USER}
      - MVN_PASSWORD=${MVN_PASSWORD}
      - DMS_URL=${DMS_URL}
      - DMS_USER=${DMS_USER}
      - DMS_PASSWORD=${DMS_PASSWORD}
      - PSQL_API_URL=${PSQL_API_URL}
      - PSQL_API_USER=${PSQL_API_USER}
      - PSQL_API_PASSWORD=${PSQL_API_PASSWORD}
      - MVN_PREFIX=${MVN_PREFIX}
    image: ${DOCKER_REGISTRY_HOST:-ghcr.io}/octopusden/octopus-oc-srv-jobs-dms-mirror:latest

